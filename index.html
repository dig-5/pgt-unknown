<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Paquetes - PGT</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">

  <!-- Header -->
  <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-40">
    <div class="flex items-center justify-between p-4">
      <button id="menuBtn" class="text-gray-300 hover:text-white focus:outline-none">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
      <h1 id="headerTitle" class="text-lg font-bold tracking-wider uppercase">INICIO</h1>
      <div class="w-8"></div>
    </div>
  </header>

  <!-- Sidebar -->
  <div id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-gray-900 border-r border-gray-700 transform -translate-x-full transition-transform duration-300 z-50">
    <div class="p-6 border-b border-gray-700 flex justify-between items-center">
      <span class="text-xl font-bold italic">PGT UNKNOWN</span>
      <button id="closeMenuBtn" class="text-gray-400 hover:text-white">&times;</button>
    </div>
    <nav class="p-4 space-y-3">
      <button onclick="navigate('inicio')" class="w-full text-left p-3 border border-gray-600 rounded-lg hover:bg-gray-800 transition">Inicio</button>
      <button onclick="navigate('unknowns')" class="w-full text-left p-3 border border-gray-600 rounded-lg hover:bg-gray-800 transition">Unknowns</button>
      <button onclick="navigate('sin-ubicar')" class="w-full text-left p-3 border border-gray-600 rounded-lg hover:bg-gray-800 transition">No Encontrados</button>
      <button onclick="navigate('ubicados')" class="w-full text-left p-3 border border-gray-600 rounded-lg hover:bg-gray-800 transition">Ubicados</button>
      <button onclick="navigate('finalizados')" class="w-full text-left p-3 border border-gray-600 rounded-lg hover:bg-gray-800 transition">Finalizados</button>
      <button onclick="navigate('crear')" class="w-full text-left p-3 border border-gray-600 rounded-lg hover:bg-gray-800 transition">Crear Paquete</button>
    </nav>
  </div>
  <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-40"></div>

  <!-- Visor de Imágenes -->
  <div id="imageViewer" class="fixed inset-0 z-50 bg-black bg-opacity-90 hidden flex-col items-center justify-center p-4 overflow-hidden" onclick="cerrarVisorImagen(true)">
    <button class="absolute top-4 right-4 text-white text-4xl hover:text-gray-300 z-[60]">&times;</button>
    <img id="viewerImg" class="max-w-full max-h-full object-contain cursor-zoom-in transition-transform duration-300" onclick="event.stopPropagation(); toggleZoom(this)">
  </div>

  <main class="p-4 max-w-7xl mx-auto">
    <!-- INICIO -->
    <section id="inicio" class="view-section active text-center mt-20">
      <p class="text-xl italic text-gray-400">"Página de Prueba para los Unknown"</p>
    </section>

    <!-- UNKNOWNS (Antes Sin Ubicar) -->
    <section id="unknowns" class="view-section">
      <div class="mb-6 bg-gray-800 p-4 rounded-xl border border-gray-700">
        <div class="mb-4">
          <input type="text" id="searchInputUnk" placeholder="🔍 Buscar por tracking, casilla, courier..." class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none">
        </div>
        <div class="flex flex-col md:flex-row gap-4 justify-between items-start w-full">
          <div class="w-full md:w-1/3 flex flex-col gap-2">
            <label class="block text-sm text-gray-400">Ubicación:</label>
            <select id="filtroUbicacionUnk" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none">
              <option value="">Seleccionar</option>
              <option value="B PISO">B PISO</option><option value="PALLET PISO">PALLET PISO</option><option value="PALLET PISO 2">PALLET PISO 2</option>
              <option value="013">013</option><option value="622">622</option><option value="674">674</option><option value="685">685</option>
              <option value="736">736</option><option value="767">767</option><option value="790">790</option><option value="838">838</option><option value="896">896</option>
              <option value="962">962</option><option value="Retenido">Retenido</option>
            </select>
            <button id="btnLimpiarFiltrosUnk" class="bg-gray-700 hover:bg-gray-600 border border-gray-500 rounded-lg px-4 py-2 text-base transition self-start md:self-auto">Limpiar Filtro</button>
          </div>
          <div class="flex w-full md:w-auto mt-4 md:mt-0 items-end justify-end">
             <button id="btnToggleMulti" class="w-full md:w-auto bg-gray-700 hover:bg-gray-600 border border-gray-500 rounded-lg px-6 py-3 text-base transition">Selección múltiple</button>
          </div>
        </div>
      </div>
      
      <div id="multiActionsHeader" class="hidden bg-gray-800 p-4 rounded-xl border border-gray-700 mb-4 flex flex-col sm:flex-row gap-4 items-center justify-between">
          <div class="flex items-center gap-3 w-full sm:w-auto">
              <input type="checkbox" id="chkSelectAll" class="custom-checkbox">
              <label for="chkSelectAll" class="text-base text-white cursor-pointer select-none">Seleccionar todo</label>
          </div>
          <div class="flex gap-2 w-full sm:w-auto">
            <button onclick="procesarMultiples('SinUbicar')" class="flex-1 sm:flex-none whitespace-nowrap bg-transparent border border-gray-400 hover:bg-gray-700 text-white rounded-lg px-6 py-3 text-base transition">No Encontrado</button>
            <button onclick="procesarMultiples('Listo')" class="flex-1 sm:flex-none bg-blue-600 hover:bg-blue-500 text-white rounded-lg px-6 py-3 text-base transition">Listo</button>
          </div>
      </div>

      <h2 class="text-sm text-gray-400 mb-3" id="countUnknowns">Unknown (0)</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5" id="gridUnknowns"></div>
      <p id="noResultsMsgUnk" class="hidden text-center text-gray-400 mt-10 text-lg">No se encontró ningún paquete</p>
    </section>

    <!-- UBICADOS -->
    <section id="ubicados" class="view-section">
      <div class="mb-6 bg-gray-800 p-4 rounded-xl border border-gray-700">
        <input type="text" id="searchInputUbi" placeholder="🔍 Buscar en ubicados..." class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none">
      </div>
      <h2 class="text-sm text-gray-400 mb-3" id="countUbicados">Unknown (0)</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5" id="gridUbicados"></div>
      <p id="noResultsMsgUbi" class="hidden text-center text-gray-400 mt-10 text-lg">No se encontró ningún paquete</p>
    </section>

    <!-- FINALIZADOS -->
    <section id="finalizados" class="view-section">
      <div class="mb-6 bg-gray-800 p-4 rounded-xl border border-gray-700">
        <input type="text" id="searchInputFin" placeholder="🔍 Buscar en finalizados..." class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none">
      </div>
      <h2 class="text-sm text-gray-400 mb-3" id="countFinalizados">Unknown (0)</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5" id="gridFinalizados"></div>
      <p id="noResultsMsgFin" class="hidden text-center text-gray-400 mt-10 text-lg">No se encontró ningún paquete</p>
    </section>

    <!-- CREAR PAQUETE -->
    <section id="crear" class="view-section">
      <div class="max-w-xl mx-auto bg-gray-800 border border-gray-700 rounded-2xl p-6 shadow-lg">
        <form id="formCrearPaquete" class="space-y-4">
          <div><label class="block text-sm text-gray-400 mb-1">Tracking *</label><input type="text" id="inputTracking" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:border-blue-500 focus:outline-none"></div>
          <div>
            <label class="block text-sm text-gray-400 mb-1">Courier *</label>
            <select id="inputCourier" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none">
              <option value="">Seleccionar</option>
              <option value="Ubox">Ubox</option><option value="Flashbox">Flashbox</option><option value="Royalbox">Royalbox</option>
              <option value="PGT">PGT</option><option value="Bubbabox">Bubbabox</option><option value="Clickbox">Clickbox</option>
              <option value="Rayo">Rayo</option><option value="Ultrabox">Ultrabox</option><option value="Fixo">Fixo</option>
              <option value="MHImport">MHImport</option><option value="OnBoard">OnBoard</option><option value="CMG">CMG</option>
              <option value="Novabox">Novabox</option><option value="ZumExpress">ZumExpress</option>
            </select>
          </div>
          <div><label class="block text-sm text-gray-400 mb-1">Casilla *</label><input type="text" id="inputCasilla" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none"></div>
          <div>
            <label class="block text-sm text-gray-400 mb-1">Ubicación *</label>
            <select id="inputUbicacion" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none">
              <option value="">Seleccionar</option><option value="B PISO">B PISO</option><option value="PALLET PISO">PALLET PISO</option><option value="PALLET PISO 2">PALLET PISO 2</option>
              <option value="013">013</option><option value="622">622</option><option value="674">674</option><option value="685">685</option>
              <option value="736">736</option><option value="767">767</option><option value="790">790</option><option value="838">838</option><option value="896">896</option>
              <option value="962">962</option><option value="Retenido">Retenido</option>
            </select>
          </div>
          <div><label class="block text-sm text-gray-400 mb-1">Nombre del cliente (Opcional)</label><input type="text" id="inputNombreCliente" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none"></div>
          <div>
            <label class="block text-sm text-gray-400 mb-1">Plataforma de Solicitud *</label>
            <select id="inputPlataforma" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none">
              <option value="">Seleccionar</option><option value="Correo">Correo</option><option value="TicketUbox">TicketUbox</option><option value="Otro">Otro</option>
            </select>
          </div>
          <div><label class="block text-sm text-gray-400 mb-1">Título de la Solicitud *</label><input type="text" id="inputTitulo" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none"></div>
          <div><label class="block text-sm text-gray-400 mb-1">URL de la Imagen *</label><input type="url" id="inputImagenURL" required placeholder="https://..." class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none"></div>
          <div class="pt-4 flex justify-center"><button type="submit" id="btnGuardar" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg px-10 py-3 transition text-base">Crear</button></div>
        </form>
      </div>
    </section>

    <!-- NUEVA PANTALLA: SIN UBICAR -->
    <section id="sin-ubicar" class="view-section">
      <div class="mb-6 bg-gray-800 p-4 rounded-xl border border-gray-700 flex flex-col md:flex-row gap-4">
        <div class="flex-1">
          <input type="text" id="searchInputSU" placeholder="🔍 Buscar por tracking, casilla..." class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none">
        </div>
        <div class="w-full md:w-1/3">
          <select id="filtroCourierSU" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none">
            <option value="">Filtrar Courier (Todos)</option>
            <option value="Ubox">Ubox</option><option value="Flashbox">Flashbox</option><option value="Royalbox">Royalbox</option>
            <option value="PGT">PGT</option><option value="Bubbabox">Bubbabox</option><option value="Clickbox">Clickbox</option>
            <option value="Rayo">Rayo</option><option value="Ultrabox">Ultrabox</option><option value="Fixo">Fixo</option>
            <option value="MHImport">MHImport</option><option value="OnBoard">OnBoard</option><option value="CMG">CMG</option>
            <option value="Novabox">Novabox</option><option value="ZumExpress">ZumExpress</option>
          </select>
        </div>
      </div>
      <h2 class="text-sm text-gray-400 mb-3" id="countSinUbicar">Unknown (0)</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5" id="gridSinUbicar"></div>
      <p id="noResultsMsgSU" class="hidden text-center text-gray-400 mt-10 text-lg">No se encontró ningún paquete</p>
    </section>

    <!-- DETALLE PAQUETE -->
    <section id="detalle-paquete" class="view-section">
      <button onclick="history.back()" class="mb-4 text-gray-300 hover:text-white flex items-center font-bold">
        <span class="mr-2 text-xl">&larr;</span> VOLVER
      </button>
      <div class="max-w-xl mx-auto bg-gray-800 border border-gray-700 rounded-2xl p-6 shadow-lg flex flex-col h-full" id="detalleContenedor">
      </div>
    </section>

  </main>

  <script src="js/app.js"></script>
  <script type="module" src="js/firebase.js"></script>
</body>
</html>
